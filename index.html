<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sphinx</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#eef0f1;
    --surface:#ffffff;
    --surface-2:#e4e7e9;
    --fg:#1f2937;
    --muted:#565f6b;
    --rule:#d7dbde;
    --accent:#2f6b4f;
    --accent-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1f2937;
      --surface:#242e3b;
      --surface-2:#2c3647;
      --fg:#f3f4f6;
      --muted:#a8b1bd;
      --rule:#3a4556;
      --accent:#5f9b78;
      --accent-ink:#1f2937;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1f2937;
    --surface:#242e3b;
    --surface-2:#2c3647;
    --fg:#f3f4f6;
    --muted:#a8b1bd;
    --rule:#3a4556;
    --accent:#5f9b78;
    --accent-ink:#1f2937;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 64px}
  a{color:var(--accent)}

  nav.site-nav{background:var(--surface);border-bottom:1px solid var(--rule)}
  .site-nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
  .site-nav-brand{display:flex;align-items:center;gap:8px;font-family:"Sora",system-ui,sans-serif;font-weight:700;color:var(--fg);text-decoration:none;font-size:1rem}
  .site-nav-icon{width:24px;height:24px;flex-shrink:0;border-radius:6px}

  .theme-toggle{
    position:fixed;
    top:14px;
    right:14px;
    z-index:10;
    display:flex;
    gap:2px;
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:999px;
    padding:3px;
  }
  .theme-toggle button{
    width:32px;height:32px;
    border:none;
    border-radius:999px;
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .theme-toggle button.active{
    background:var(--surface-2);
    color:var(--fg);
  }

  .hero{text-align:center;padding-block:72px 56px}
  .hero img{width:72px;height:72px;border-radius:16px;margin-bottom:18px}
  .hero h1{font-family:"Sora",system-ui,sans-serif;font-size:2.2rem;margin:0 0 10px}
  .hero p{color:var(--muted);max-width:32ch;margin:0 auto}

  footer{padding-block:40px 48px;background:var(--surface);border-top:1px solid var(--rule)}
  footer .wrap{
    display:flex;
    align-items:center;
    gap:16px;
    color:var(--muted);
    font-size:0.86rem;
  }
  .footer-icon{width:40px;height:40px;flex-shrink:0;border-radius:8px}
  .footer-links{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
  footer .brand{font-family:"Sora",system-ui,sans-serif;color:var(--fg);font-weight:600;margin-right:4px;text-decoration:none}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--fg)}
</style>
</head><body>
<script>
(function () {
  try {
    var saved = localStorage.getItem('sphinx-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>

<div class="theme-toggle" role="group" aria-label="Theme">
  <button type="button" data-theme-choice="light" aria-label="Light" title="Light">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
    </svg>
  </button>
  <button type="button" data-theme-choice="dark" aria-label="Dark" title="Dark">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
    </svg>
  </button>
  <button type="button" data-theme-choice="system" aria-label="Follow the device" title="Follow the device">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="2" />
      <path d="M8 20h8M12 16v4" />
    </svg>
  </button>
</div>

<nav class="site-nav">
  <div class="wrap site-nav-inner">
    <a class="site-nav-brand" href="index.html"><img class="site-nav-icon" src="favicon.png" alt="">Sphinx</a>
  </div>
</nav>

<div class="hero wrap">
  <img src="favicon.png" alt="">
  <h1>Sphinx</h1>
  <p>A party word-guessing game. The rest of this site — features, how to
  play, screenshots — is on its way.</p>
</div>

<footer>
  <div class="wrap">
    <img class="footer-icon" src="favicon.png" alt="">
    <div class="footer-links">
      <a class="brand" href="index.html">Sphinx</a>
      <a href="privacy-policy.html">Privacy policy</a>
      <a href="mailto:joaorodr84@gmail.com">joaorodr84@gmail.com</a>
    </div>
  </div>
</footer>


<script>
(function () {
  var KEY = 'sphinx-theme';
  var buttons = document.querySelectorAll('[data-theme-choice]');

  function currentChoice() {
    var attr = document.documentElement.getAttribute('data-theme');
    return attr === 'light' || attr === 'dark' ? attr : 'system';
  }
  function reflectActive() {
    var choice = currentChoice();
    buttons.forEach(function (btn) {
      var isActive = btn.getAttribute('data-theme-choice') === choice;
      btn.classList.toggle('active', isActive);
    });
  }
  function apply(choice) {
    if (choice === 'light' || choice === 'dark') {
      document.documentElement.setAttribute('data-theme', choice);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    reflectActive();
    try { localStorage.setItem(KEY, choice); } catch (e) {}
  }

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      apply(btn.getAttribute('data-theme-choice'));
    });
  });
  reflectActive();
})();
</script>


</body></html>
